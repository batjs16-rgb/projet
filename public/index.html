<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — 2FA Auth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h1 { text-align: center; margin-bottom: 0.5rem; color: #1a1a2e; font-size: 1.6rem; }

    .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.9rem; }

    label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #333; font-size: 0.9rem; }

    input {
      width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 1rem; margin-bottom: 1.2rem; transition: border-color 0.2s;
    }

    input:focus { outline: none; border-color: #4f46e5; }

    button {
      width: 100%; padding: 0.85rem; background: #4f46e5; color: white;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }

    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    .message {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px;
      font-size: 0.9rem; text-align: center; display: none;
    }

    .message.error { background: #fee2e2; color: #dc2626; }
    .message.success { background: #dcfce7; color: #16a34a; }

    .link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #666; }
    .link a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    .link a:hover { text-decoration: underline; }

    #step-2fa { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h1>🔐 Connexion</h1>
  <p class="subtitle">Authentification à deux facteurs</p>

  <!-- Étape 1 : Identifiants -->
  <div id="step-password">
    <label for="username">Nom d'utilisateur</label>
    <input type="text" id="username" placeholder="Votre identifiant" autocomplete="username" />

    <label for="password">Mot de passe</label>
    <input type="password" id="password" placeholder="Votre mot de passe" autocomplete="current-password" />

    <button id="btn-login" onclick="etape1()">Se connecter</button>
  </div>

  <!-- Étape 2 : Code 2FA -->
  <div id="step-2fa">
    <label for="token">Code Google Authenticator</label>
    <input type="text" id="token" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" />

    <button id="btn-verify" onclick="etape2()">Vérifier le code</button>
  </div>

  <div class="message" id="message"></div>

  <div class="link">
    Pas encore de compte ? <a href="/register.html">S'inscrire</a>
  </div>
</div>

<script>
  function afficherMessage(texte, type) {
    const el = document.getElementById('message');
    el.textContent = texte;
    el.className = `message ${type}`;
    el.style.display = 'block';
  }

  // Étape 1 : envoi du nom d'utilisateur + mot de passe
  async function etape1() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');

    if (!username || !password) return afficherMessage('Veuillez remplir tous les champs.', 'error');

    btn.disabled = true;
    btn.textContent = 'Vérification...';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        afficherMessage(data.error, 'error');
      } else {
        // Passer à l'étape 2FA
        document.getElementById('step-password').style.display = 'none';
        document.getElementById('step-2fa').style.display = 'block';
        afficherMessage('Mot de passe accepté. Entrez votre code 2FA.', 'success');
      }
    } catch (e) {
      afficherMessage('Erreur réseau. Réessayez.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }
  }

  // Étape 2 : envoi du code TOTP
  async function etape2() {
    const token = document.getElementById('token').value.trim();
    const btn = document.getElementById('btn-verify');

    if (!token || token.length !== 6) return afficherMessage('Le code doit contenir 6 chiffres.', 'error');

    btn.disabled = true;
    btn.textContent = 'Vérification...';

    try {
      const res = await fetch('/auth/verify-2fa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      });
      const data = await res.json();

      if (!res.ok) {
        afficherMessage(data.error, 'error');
      } else {
        afficherMessage('Connexion réussie ! Redirection...', 'success');
        setTimeout(() => window.location.href = data.redirect, 1000);
      }
    } catch (e) {
      afficherMessage('Erreur réseau. Réessayez.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Vérifier le code';
    }
  }

  // Validation avec la touche Entrée
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      document.getElementById('step-2fa').style.display === 'block' ? etape2() : etape1();
    }
  });
</script>

</body>
</html>
